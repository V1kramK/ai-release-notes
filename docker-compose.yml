version: "3.9"

services:
  app:
    build:
      context: .
      target: production
    ports:
      - "3001:3001"
    volumes:
      - audit_data:/app/data/audit
    environment:
      - PORT=3001
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CURSOR_MODEL_ID=claude-4-5
      - MAX_CONCURRENT_GENERATIONS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  audit_data:
    driver: local
